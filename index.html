<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miroir Déformant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; gap: 18px; }
  h1 { font-size: 22px; font-weight: 500; }
  #canvases { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .canvas-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .canvas-wrap label { font-size: 13px; color: #aaa; }
  canvas { border-radius: 14px; border: 1px solid #333; display: block; width: 480px; max-width: 100%; height: auto; image-rendering: auto; -webkit-media-controls: none; }
  canvas::-webkit-media-controls { display: none !important; }
  video { display: none !important; }
  #controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 960px; }
  button.effect { padding: 7px 13px; font-size: 12px; border-radius: 8px; border: 1px solid #444; background: #16213e; color: #ccc; cursor: pointer; transition: all .15s; }
  button.effect:hover { background: #0f3460; color: #fff; }
  button.effect.active { background: #533ab7; color: #fff; border-color: #7F77DD; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .row label { font-size: 13px; color: #aaa; }
  input[type=range] { width: 160px; accent-color: #7F77DD; }
  .val { font-size: 14px; font-weight: 500; min-width: 32px; }
  .btn { padding: 9px 18px; font-size: 13px; border-radius: 8px; border: 1px solid #444; background: #16213e; color: #ccc; cursor: pointer; transition: all .15s; display: inline-block; text-align: center; }
  .btn:hover { background: #0f3460; color: #fff; }
  .btn.green { background: #0f6e56; color: #fff; border-color: #1D9E75; }
  .btn.red { background: #993c1d; color: #fff; border-color: #D85A30; }
  .btn.purple { background: #533ab7; color: #fff; border-color: #7F77DD; }
  .btn.orange { background: #7a4e00; color: #fff; border-color: #c97d00; }
  .btn.rec { background: #8b0000 !important; color: #fff !important; border-color: #ff4444 !important; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }
  input[type=file] { display: none; }
  #camStatus { font-size: 12px; color: #aaa; }
  #fx2Select { padding: 7px 10px; font-size: 12px; border-radius: 8px; border: 1px solid #444; background: #16213e; color: #ccc; }
  #combo-toggle { padding: 7px 13px; font-size: 12px; border-radius: 8px; border: 1px solid #444; background: #16213e; color: #ccc; cursor: pointer; }
  #combo-toggle.active { background: #533ab7; color: #fff; border-color: #7F77DD; }
  #recStatus { font-size: 12px; color: #f90; }

  /* Overlay plein écran */
  #fs-overlay { display: none; position: absolute; z-index: 9999; bottom: 24px; right: 24px; flex-direction: column; gap: 12px; align-items: flex-end; }
  #fs-overlay.visible { display: flex; }
  .fs-btn { width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); transition: transform .15s; }
  .fs-btn:hover { transform: scale(1.1); }
  #fs-snap { background: rgba(15,110,86,0.85); }
  #fs-rec  { background: rgba(139,0,0,0.85); }
  #fs-rec.rec { animation: blink 1s infinite; }
  #fs-style { background: rgba(83,58,183,0.85); }
  #fs-close { background: rgba(60,60,80,0.85); font-size: 18px; }
  #fs-panel { display: none; position: absolute; z-index: 9998; bottom: 0; left: 0; right: 0;
    background: rgba(20,20,40,0.95); backdrop-filter: blur(12px);
    padding: 20px 16px 32px; border-top: 1px solid #444;
    flex-direction: column; gap: 14px; align-items: center;
    transform: translateY(100%); transition: transform .3s ease; }
  #fs-panel.open { display: flex; transform: translateY(0); }
  #fs-panel-effects { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 700px; }
  .fs-effect { padding: 8px 14px; font-size: 13px; border-radius: 8px; border: 1px solid #444; background: #16213e; color: #ccc; cursor: pointer; }
  .fs-effect.active { background: #533ab7; color: #fff; border-color: #7F77DD; }
  #fs-panel-sliders { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; align-items: center; }
  #fs-panel-sliders label { font-size: 13px; color: #aaa; }
  #fs-panel-sliders input[type=range] { width: 130px; accent-color: #7F77DD; }
  #fs-panel-close { font-size: 13px; color: #888; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<!-- Wrapper plein écran -->
<div id="fs-wrapper" style="position:relative;">
  <div id="canvases">
    <div class="canvas-wrap"><label>Original</label><canvas id="src" width="960" height="540"></canvas></div>
    <div class="canvas-wrap"><label>Miroir déformant</label><canvas id="dst" width="960" height="540"></canvas></div>
  </div>

<!-- Overlay boutons plein écran -->
<div id="fs-overlay">

<div id="fs-panel">

    <button class="fs-effect active" data-fx="wave">🌊 Vague</button>

    <button class="fs-effect" data-fx="fisheye">👁️ Fisheye</button>
    <button class="fs-effect" data-fx="spiral">🌪️ Spirale</button>
    <button class="fs-effect" data-fx="liquid">💧 Liquide</button>
    <button class="fs-effect" data-fx="shake">📳 Tremblement</button>
    <button class="fs-effect" data-fx="zoom_pulse">🔭 Zoom</button>
    <button class="fs-effect" data-fx="vortex">🕳️ Vortex</button>
    <button class="fs-effect" data-fx="radial">⭕ Radial</button>
    <button class="fs-effect" data-fx="fun">🎭 Fun</button>
    <button class="fs-effect" data-fx="mirror4">🔲 Miroir x4</button>
    <button class="fs-effect" data-fx="mirror_diag">🔀 Diagonal</button>
    <button class="fs-effect" data-fx="kaleidoscope">💠 Kaléidoscope</button>
    <button class="fs-effect" data-fx="prism">🌈 Prisme</button>
    <button class="fs-effect" data-fx="thermal">🌡️ Thermique</button>
    <button class="fs-effect" data-fx="vintage">📷 Vintage</button>
    <button class="fs-effect" data-fx="neon">✨ Néon</button>
    <button class="fs-effect" data-fx="psychedelic">🎨 Psychédélique</button>
    <button class="fs-effect" data-fx="negative">🔄 Négatif</button>
    <button class="fs-effect" data-fx="glitch">⚡ Glitch</button>
    <button class="fs-effect" data-fx="pixel">🟦 Pixelisé</button>
    <button class="fs-effect" data-fx="mosaic">🧩 Mosaïque</button>
    <button class="fs-effect" data-fx="mirror_h">↕️ Miroir H</button>
    <button class="fs-effect" data-fx="tunnel">🕳️ Tunnel</button>
    <button class="fs-effect" data-fx="crystal">💎 Cristal</button>
    <button class="fs-effect" data-fx="halo">🔆 Halo</button>
    <button class="fs-effect" data-fx="sepia">🟤 Sépia</button>
    <button class="fs-effect" data-fx="zoom_region">🔎 Zoom région</button>

  </div>
  <div id="fs-panel-sliders">
    <label>Intensité</label>
    <input type="range" id="fs-strength" min="1" max="100" value="50">
    <span class="val" id="fs-strengthOut">50</span>
    <label>Vitesse</label>
    <input type="range" id="fs-speed" min="1" max="200" value="100">
    <span class="val" id="fs-speedOut">1.0x</span>
  </div>
  <span id="fs-panel-close">✕ Fermer</span>
</div>
</div>

<div id="controls">
  <button class="effect active" data-fx="wave">🌊 Vague</button>
  <button class="effect" data-fx="lateral">↔️ Latéral</button>
  <button class="effect" data-fx="bulge">🫧 Bosse</button>
  <button class="effect" data-fx="funnel">🔻 Entonnoir</button>
  <button class="effect" data-fx="swirl">🌀 Tourbillon</button>
  <button class="effect" data-fx="fisheye">👁️ Fisheye</button>
  <button class="effect" data-fx="spiral">🌪️ Spirale</button>
  <button class="effect" data-fx="liquid">💧 Liquide</button>
  <button class="effect" data-fx="shake">📳 Tremblement</button>
  <button class="effect" data-fx="zoom_pulse">🔭 Zoom pulsant</button>
  <button class="effect" data-fx="vortex">🕳️ Vortex</button>
  <button class="effect" data-fx="radial">⭕ Radial</button>
  <button class="effect" data-fx="fun">🎭 Fun</button>
  <button class="effect" data-fx="mirror4">🔲 Miroir x4</button>
  <button class="effect" data-fx="mirror_diag">🔀 Diagonal</button>
  <button class="effect" data-fx="kaleidoscope">💠 Kaléidoscope</button>
  <button class="effect" data-fx="prism">🌈 Prisme</button>
  <button class="effect" data-fx="thermal">🌡️ Thermique</button>
  <button class="effect" data-fx="vintage">📷 Vintage</button>
  <button class="effect" data-fx="neon">✨ Néon</button>
  <button class="effect" data-fx="psychedelic">🎨 Psychédélique</button>
  <button class="effect" data-fx="negative">🔄 Négatif</button>
  <button class="effect" data-fx="glitch">⚡ Glitch</button>
  <button class="effect" data-fx="pixel">🟦 Pixelisé</button>
  <button class="effect" data-fx="mosaic">🧩 Mosaïque</button>
  <button class="effect" data-fx="mirror_h">↕️ Miroir H</button>
  <button class="effect" data-fx="tunnel">🕳️ Tunnel</button>
  <button class="effect" data-fx="crystal">💎 Cristal</button>
  <button class="effect" data-fx="halo">🔆 Halo</button>
  <button class="effect" data-fx="sepia">🟤 Sépia</button>
  <button class="effect" data-fx="zoom_region">🔎 Zoom région</button>

</div>

<div class="row">
  <button id="combo-toggle">🔀 Combiner 2 effets</button>
  <select id="fx2Select" style="display:none">
    <option value="none">— 2e effet —</option>
    <option value="wave">🌊 Vague</option>
    <option value="lateral">↔️ Latéral</option>
    <option value="bulge">🫧 Bosse</option>
    <option value="funnel">🔻 Entonnoir</option>
    <option value="swirl">🌀 Tourbillon</option>
    <option value="fisheye">👁️ Fisheye</option>
    <option value="spiral">🌪️ Spirale</option>
    <option value="liquid">💧 Liquide</option>
    <option value="prism">🌈 Prisme</option>
    <option value="thermal">🌡️ Thermique</option>
    <option value="neon">✨ Néon</option>
    <option value="psychedelic">🎨 Psychédélique</option>
    <option value="negative">🔄 Négatif</option>
    <option value="glitch">⚡ Glitch</option>
  </select>

<div class="row">
  <label>Intensité</label>
  <input type="range" id="strength" min="1" max="100" value="50">
  <span class="val" id="strengthOut">50</span>
  <label>Vitesse</label>
  <input type="range" id="speed" min="1" max="200" value="100">
  <span class="val" id="speedOut">1.0x</span>
</div>

<div class="row">
  <button class="btn purple" id="camBtn">📷 Activer caméra</button>
  <button class="btn green" id="snapBtn" style="display:none">📸 Prendre photo</button>
  <button class="btn red" id="stopBtn" style="display:none">⏹ Arrêter</button>
  <button class="btn orange" id="fullBtn">⛶ Plein écran</button>
  <span id="camStatus"></span>
  <span id="fsHint" style="font-size:11px;color:#888;width:100%;text-align:center">💡 Pour la caméra en plein écran : activer la caméra d'abord, puis plein écran</span>
</div>

<div class="row">
  <label class="btn" for="fileIn">🖼️ Charger image</label>
  <input type="file" id="fileIn" accept="image/*">
  <label class="btn" for="camInIOS">📱 Photo iOS/Chromebook</label>
  <input type="file" id="camInIOS" accept="image/*" capture="user">
  <button class="btn green" id="saveBtn" style="display:none">💾 Sauvegarder</button>
  <button class="btn red" id="recBtn">⏺ Enregistrer vidéo</button>
  <span id="recStatus"></span>
  <span id="recInfo" style="font-size:11px;color:#666;width:100%;text-align:center"></span>
</div>

<script>
const srcC = document.getElementById('src');
const dstC = document.getElementById('dst');
const sCtx = srcC.getContext('2d');
const dCtx = dstC.getContext('2d', { willReadFrequently: true });
// Résolution affichage (fluide) vs sauvegarde (HD)
const RW = 480, RH = 270;   // rendu temps réel — léger et fluide
const SW = 1920, SH = 1080; // sauvegarde HD
const W = RW, H = RH;
srcC.width = RW; srcC.height = RH;
dstC.width = RW; dstC.height = RH;
let currentFx = 'wave', currentFx2 = 'none', comboOn = false;
let strength = 50, speedMult = 1;
let srcImg = null, loopInterval = null, frozenImageData = null;
let stream = null, video = null, animId = null;

// Enregistrement : capture de frames PNG → ZIP téléchargeable
let isRecording = false, recFrames = [], recTimer = null;
let mediaRecorder = null, recChunks = [];
const canCapture = typeof dstC.captureStream === 'function';
window.addEventListener('load', () => {
  if (!canCapture) {
    document.getElementById('recBtn').style.display = 'none';
    document.getElementById('recInfo').textContent = '⚠️ Enregistrement vidéo non disponible sur iOS/iPad — utilise 💾 Sauvegarder pour capturer une photo';
  } else {
    document.getElementById('recInfo').textContent = '✅ Enregistrement vidéo .webm disponible';
  }
});

document.querySelectorAll('.effect').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.effect').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); currentFx = b.dataset.fx;
    if (!stream && srcImg) applyEffect();
  });
});
document.getElementById('combo-toggle').addEventListener('click', () => {
  comboOn = !comboOn;
  document.getElementById('combo-toggle').classList.toggle('active', comboOn);
  document.getElementById('fx2Select').style.display = comboOn ? 'inline-block' : 'none';
});
document.getElementById('fx2Select').addEventListener('change', e => { currentFx2 = e.target.value; });
document.getElementById('strength').addEventListener('input', e => {
  strength = +e.target.value; document.getElementById('strengthOut').textContent = strength;
  if (!stream && srcImg) applyEffect();
});
document.getElementById('speed').addEventListener('input', e => {
  speedMult = +e.target.value / 100; document.getElementById('speedOut').textContent = speedMult.toFixed(1)+'x';
});

function stopLoop() {
  clearInterval(loopInterval);
  cancelAnimationFrame(loopInterval);
  loopInterval = null;
}

function startLoop() {
  stopLoop();
  function renderLoop() { applyEffect(); loopInterval = requestAnimationFrame(renderLoop); }
  renderLoop();
}

function loadFromFile(file) {
  if (!file) return; stopCam();
  const img = new Image();
  img.onload = () => {
    srcImg = img;
    sCtx.clearRect(0,0,W,H);
    const scale = Math.max(W/img.width, H/img.height);
    sCtx.drawImage(img,(W-img.width*scale)/2,(H-img.height*scale)/2,img.width*scale,img.height*scale);
    startLoop();
    document.getElementById('saveBtn').style.display='inline-block';
  };
  img.src = URL.createObjectURL(file);
}
document.getElementById('fileIn').addEventListener('change', e => loadFromFile(e.target.files[0]));
document.getElementById('camInIOS').addEventListener('change', e => loadFromFile(e.target.files[0]));

document.getElementById('camBtn').addEventListener('click', async () => {
  stopLoop(); srcImg = null;
  document.getElementById('camStatus').textContent = 'Connexion...';
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{width:W,height:H,facingMode:'user'}});
    video = document.createElement('video');
    video.srcObject = stream; 
    video.setAttribute('playsinline', true);
    video.setAttribute('disablepictureinpicture', true);
    video.controls = false;
    video.play();
    video.onloadedmetadata = () => {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      document.getElementById('camBtn').style.display='none';
      document.getElementById('snapBtn').style.display='inline-block';
      document.getElementById('stopBtn').style.display='inline-block';
      document.getElementById('camStatus').textContent='🟢 Caméra active';
      document.getElementById('fs-panel').classList.remove('open');
      if (!isFs) {
        // Masquer toute l'interface seulement si pas en plein écran
        document.querySelectorAll('.row, #controls, h1').forEach(el => el.style.display='none');
        document.getElementById('fs-overlay').style.pointerEvents='none';
        document.getElementById('fs-overlay').style.opacity='0';
      }
      camLoop();
    };
  } catch(e) { document.getElementById('camStatus').textContent='❌ Non disponible — utilise Photo iOS/Chromebook'; }
});
document.getElementById('snapBtn').addEventListener('click', () => {
  const frozen = sCtx.getImageData(0,0,W,H);
  stopCam();
  sCtx.putImageData(frozen,0,0);
  // Garder srcImg=null pour que saveHD utilise srcC directement
  // et stocker les données frozen pour la sauvegarde HD
  srcImg = null;
  frozenImageData = frozen;
  startLoop();
  document.getElementById('camStatus').textContent='📷 Photo prise';
  document.getElementById('saveBtn').style.display='inline-block';
});
document.getElementById('stopBtn').addEventListener('click', () => { stopCam(); document.getElementById('camStatus').textContent=''; });

function stopCam() {
  if (stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; }
  if (animId) { cancelAnimationFrame(animId); animId=null; }
  document.getElementById('camBtn').style.display='inline-block';
  document.getElementById('snapBtn').style.display='none';
  document.getElementById('stopBtn').style.display='none';
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  if (!isFs) {
    // Restaurer toute l'interface seulement si pas en plein écran
    document.querySelectorAll('.row, #controls, h1').forEach(el => el.style.display='');
    document.getElementById('fs-overlay').style.pointerEvents='';
    document.getElementById('fs-overlay').style.opacity='';
    srcC.style.width=''; srcC.style.height='';
    dstC.style.width=''; dstC.style.height='';
    document.getElementById('canvases').style.flexDirection='row';
    document.getElementById('canvases').style.flexWrap='wrap';
  }
}
function camLoop() {
  if (!stream) return;
  sCtx.drawImage(video,0,0,W,H); applyEffect();
  animId = requestAnimationFrame(camLoop);
}

// Plein écran
document.getElementById('fullBtn').addEventListener('click', () => {
  const el = document.getElementById('fs-wrapper');
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
});

function onFsChange() {
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  document.getElementById('fs-overlay').classList.toggle('visible', isFs);
  if (isFs) {
    document.getElementById('fs-wrapper').style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:8000;display:flex;align-items:center;justify-content:center;';
    document.getElementById('canvases').style.cssText = 'display:flex;align-items:center;justify-content:center;width:100%;height:100%;';
    srcC.parentElement.style.display = 'none';
    dstC.parentElement.style.cssText = 'display:flex;width:100%;height:100%;align-items:center;justify-content:center;';
    dstC.style.cssText = 'width:100% !important;height:100% !important;max-width:100% !important;object-fit:contain;border-radius:0;';
  } else {
    document.getElementById('fs-wrapper').style.cssText = 'position:relative;';
    document.getElementById('canvases').style.cssText = '';
    srcC.parentElement.style.cssText = '';
    dstC.parentElement.style.cssText = '';
    dstC.style.cssText = '';
    document.getElementById('fs-panel').classList.remove('open');
  }
}
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);

// Boutons overlay plein écran
// fs-snap géré dans saveHD()

document.getElementById('fs-rec').addEventListener('click', () => {
  document.getElementById('recBtn').click(); // réutilise la même logique
  const isRec = document.getElementById('recBtn').classList.contains('rec');
  document.getElementById('fs-rec').classList.toggle('rec', isRec);
  document.getElementById('fs-rec').textContent = isRec ? '⏹' : '⏺';
});

document.getElementById('fs-style').addEventListener('click', () => {
  const panel = document.getElementById('fs-panel');
  panel.classList.toggle('open');
});

document.getElementById('fs-close').addEventListener('click', () => {
  if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
});

document.getElementById('fs-panel-close').addEventListener('click', () => {
  document.getElementById('fs-panel').classList.remove('open');
});

// Effets dans le panneau plein écran — synchronisés avec les boutons principaux
document.querySelectorAll('.fs-effect').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.effect, .fs-effect').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    // Sync le bouton principal correspondant
    document.querySelectorAll('.effect').forEach(x => { if (x.dataset.fx === b.dataset.fx) x.classList.add('active'); });
    currentFx = b.dataset.fx;
  });
});

// Sliders panneau plein écran — synchronisés
document.getElementById('fs-strength').addEventListener('input', e => {
  strength = +e.target.value;
  document.getElementById('fs-strengthOut').textContent = strength;
  document.getElementById('strength').value = strength;
  document.getElementById('strengthOut').textContent = strength;
});
document.getElementById('fs-speed').addEventListener('input', e => {
  speedMult = +e.target.value / 100;
  document.getElementById('fs-speedOut').textContent = speedMult.toFixed(1)+'x';
  document.getElementById('speed').value = e.target.value;
  document.getElementById('speedOut').textContent = speedMult.toFixed(1)+'x';
});

// Enregistrement : photos séquentielles → télécharge des PNG numérotés
// Compatible tous navigateurs y compris Safari/iOS
document.getElementById('recBtn').addEventListener('click', () => {
  document.getElementById('fs-panel').classList.remove('open');
  if (!isRecording) {
    isRecording = true;

      document.getElementById('recStatus').textContent = `✅ ${recFrames.length} photos — téléchargement...`;
      const frames = recFrames.slice(0, 30);

    }
  }
});

  else if(fx==='vintage'){const rv=sd[si]*.393+sd[si+1]*.769+sd[si+2]*.189,gv=sd[si]*.349+sd[si+1]*.686+sd[si+2]*.168,bv=sd[si]*.272+sd[si+1]*.534+sd[si+2]*.131,mix=1-s*.5;dd[di]=Math.min(255,rv*(1-mix)+sd[si]*mix);dd[di+1]=Math.min(255,gv*(1-mix)+sd[si+1]*mix);dd[di+2]=Math.min(255,bv*(1-mix)+sd[si+2]*mix);dd[di+3]=255;}
  else if(fx==='neon'){const lum=(sd[si]+sd[si+1]+sd[si+2])/3,edge=(lum>80&&lum<200)?1:0;const[r,g,b]=hslToRgb((t*50%360)/360,1,.5);dd[di]=edge?r:sd[si]*.2;dd[di+1]=edge?g:sd[si+1]*.2;dd[di+2]=edge?b:sd[si+2]*.2;dd[di+3]=255;}
  else if(fx==='psychedelic'){const[h,sat,l]=rgbToHsl(sd[si],sd[si+1],sd[si+2]);const[r,g,b]=hslToRgb((h+t*.1*s+.5)%1,Math.min(1,sat+s*.5),l);dd[di]=r;dd[di+1]=g;dd[di+2]=b;dd[di+3]=255;}
  else if(fx==='negative'){const p=(Math.sin(t*3)+1)/2*s;dd[di]=sd[si]+(255-2*sd[si])*p;dd[di+1]=sd[si+1]+(255-2*sd[si+1])*p;dd[di+2]=sd[si+2]+(255-2*sd[si+2])*p;dd[di+3]=255;}
  else if(fx==='prism'){const shift=Math.round(s*30),lx=Math.max(0,Math.min(W-1,sx-shift)),rx=Math.max(0,Math.min(W-1,sx+shift));dd[di]=sd[(sy*W+lx)*4];dd[di+1]=sd[si+1];dd[di+2]=sd[(sy*W+rx)*4+2];dd[di+3]=255;}
  else{dd[di]=sd[si];dd[di+1]=sd[si+1];dd[di+2]=sd[si+2];dd[di+3]=sd[si+3];}
}

function applyEffect(){
  const s=strength/100, t=(performance.now()/1000)*speedMult, cx=W/2, cy=H/2;
  if(!comboOn||currentFx2==='none'){if(applyCanvasFx(currentFx,s,t,cx,cy))return;}
  const srcData=sCtx.getImageData(0,0,W,H);let sd=srcData.data,mid=null;
  if(comboOn&&currentFx2!=='none'){mid=new Uint8ClampedArray(W*H*4);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let[sx,sy]=warp(currentFx,x,y,s,t,cx,cy);sx=Math.max(0,Math.min(W-1,Math.round(sx)));sy=Math.max(0,Math.min(H-1,Math.round(sy)));const si=(sy*W+sx)*4,di=(y*W+x)*4;colorFx(currentFx,sd,mid,di,si,sx,sy,s,t);}sd=mid;}
  const dst=dCtx.createImageData(W,H);const dd=dst.data;const fx=(comboOn&&currentFx2!=='none')?currentFx2:currentFx;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let[sx,sy]=warp(fx,x,y,s,t,cx,cy);sx=Math.max(0,Math.min(W-1,Math.round(sx)));sy=Math.max(0,Math.min(H-1,Math.round(sy)));const si=(sy*W+sx)*4,di=(y*W+x)*4;colorFx(fx,sd,dd,di,si,sx,sy,s,t);}
  dCtx.putImageData(dst,0,0);
}

(function(){
  const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
  const grd=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,200);
  grd.addColorStop(0,'#7F77DD');grd.addColorStop(.5,'#1D9E75');grd.addColorStop(1,'#D85A30');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 80px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('😀',W/2-80,H/2);ctx.fillText('🎭',W/2+80,H/2-20);
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='18px sans-serif';ctx.fillText('Chargez votre image →',W/2,H-28);
  sCtx.drawImage(c,0,0); srcImg=c;
  startLoop();
})();
