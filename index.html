<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miroir Déformant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; gap: 18px; }
  h1 { font-size: 22px; font-weight: 500; }
  #canvases { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .canvas-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .canvas-wrap label { font-size: 13px; color: #aaa; }
  canvas { border-radius: 14px; border: 1px solid #333; display: block; width: 100%; max-width: 480px; height: auto; }
  #controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button.effect { padding: 9px 18px; font-size: 14px; border-radius: 8px; border: 1px solid #444; background: #16213e; color: #ccc; cursor: pointer; transition: all .15s; }
  button.effect:hover { background: #0f3460; color: #fff; }
  button.effect.active { background: #533ab7; color: #fff; border-color: #7F77DD; }
  #sliderRow { display: flex; align-items: center; gap: 12px; }
  #sliderRow label { font-size: 13px; color: #aaa; }
  input[type=range] { width: 180px; accent-color: #7F77DD; }
  #strengthOut { font-size: 14px; font-weight: 500; min-width: 32px; }
  .btn { padding: 10px 20px; font-size: 14px; border-radius: 8px; border: 1px solid #444; background: #16213e; color: #ccc; cursor: pointer; transition: all .15s; display: inline-block; text-align: center; }
  .btn:hover { background: #0f3460; color: #fff; }
  .btn.green { background: #0f6e56; color: #fff; border-color: #1D9E75; }
  .btn.red { background: #993c1d; color: #fff; border-color: #D85A30; }
  .btn.purple { background: #533ab7; color: #fff; border-color: #7F77DD; }
  input[type=file] { display: none; }
  #camSection { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  #camStatus { font-size: 12px; color: #aaa; }
  #actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>

<h1>🪞 Miroir Déformant</h1>

<div id="canvases">
  <div class="canvas-wrap">
    <label>Original</label>
    <canvas id="src" width="480" height="360"></canvas>
  </div>
  <div class="canvas-wrap">
    <label>Miroir déformant</label>
    <canvas id="dst" width="480" height="360"></canvas>
  </div>
</div>

<div id="controls">
  <button class="effect active" data-fx="wave">🌊 Vague</button>
  <button class="effect" data-fx="lateral">↔️ Latéral</button>
  <button class="effect" data-fx="bulge">🫧 Bosse</button>
  <button class="effect" data-fx="funnel">🔻 Entonnoir</button>
  <button class="effect" data-fx="swirl">🌀 Tourbillon</button>
  <button class="effect" data-fx="fisheye">👁️ Fisheye</button>
  <button class="effect" data-fx="fun">🎭 Fun</button>
</div>

<div id="sliderRow">
  <label>Intensité</label>
  <input type="range" id="strength" min="1" max="100" value="50">
  <span id="strengthOut">50</span>
</div>

<div id="camSection">
  <button class="btn purple" id="camBtn">📷 Activer caméra</button>
  <button class="btn green" id="snapBtn" style="display:none">📸 Prendre photo</button>
  <button class="btn red" id="stopBtn" style="display:none">⏹ Arrêter</button>
  <span id="camStatus"></span>
</div>

<div id="actions">
  <label class="btn" for="fileIn">🖼️ Charger une image</label>
  <input type="file" id="fileIn" accept="image/*">
  <label class="btn" for="camInIOS">📱 Photo iOS / Chromebook</label>
  <input type="file" id="camInIOS" accept="image/*" capture="user">
  <button class="btn green" id="saveBtn">💾 Enregistrer</button>
</div>

<script>
const srcC = document.getElementById('src');
const dstC = document.getElementById('dst');
const sCtx = srcC.getContext('2d');
const dCtx = dstC.getContext('2d');
const W = 480, H = 360;
let currentFx = 'wave';
let strength = 50;
let srcImg = null;
let loopInterval = null;
let stream = null;
let video = null;
let animId = null;

document.querySelectorAll('.effect').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.effect').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentFx = b.dataset.fx;
    if (srcImg || stream) { if (!stream) applyEffect(); }
  });
});

document.getElementById('strength').addEventListener('input', e => {
  strength = +e.target.value;
  document.getElementById('strengthOut').textContent = strength;
  if (!stream && srcImg) applyEffect();
});

function loadFromFile(file) {
  if (!file) return;
  stopCam();
  const img = new Image();
  img.onload = () => {
    srcImg = img;
    sCtx.clearRect(0, 0, W, H);
    // centrer/recadrer l'image
    const scale = Math.max(W / img.width, H / img.height);
    const sw = img.width * scale, sh = img.height * scale;
    sCtx.drawImage(img, (W - sw) / 2, (H - sh) / 2, sw, sh);
    clearInterval(loopInterval);
    applyEffect();
    loopInterval = setInterval(applyEffect, 50);
  };
  img.src = URL.createObjectURL(file);
}

document.getElementById('fileIn').addEventListener('change', e => loadFromFile(e.target.files[0]));
document.getElementById('camInIOS').addEventListener('change', e => loadFromFile(e.target.files[0]));

// Caméra getUserMedia
document.getElementById('camBtn').addEventListener('click', async () => {
  clearInterval(loopInterval);
  srcImg = null;
  document.getElementById('camStatus').textContent = 'Connexion...';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: W, height: H, facingMode: 'user' } });
    video = document.createElement('video');
    video.srcObject = stream;
    video.setAttribute('playsinline', true);
    video.play();
    video.onloadedmetadata = () => {
      document.getElementById('camBtn').style.display = 'none';
      document.getElementById('snapBtn').style.display = 'inline-block';
      document.getElementById('stopBtn').style.display = 'inline-block';
      document.getElementById('camStatus').textContent = '🟢 Caméra active';
      camLoop();
    };
  } catch(err) {
    document.getElementById('camStatus').textContent = '❌ Non disponible — utilise "Photo iOS / Chromebook"';
  }
});

document.getElementById('snapBtn').addEventListener('click', () => {
  const frozen = sCtx.getImageData(0, 0, W, H);
  stopCam();
  sCtx.putImageData(frozen, 0, 0);
  srcImg = srcC;
  applyEffect();
  loopInterval = setInterval(applyEffect, 50);
  document.getElementById('camStatus').textContent = '📷 Photo prise';
});

document.getElementById('stopBtn').addEventListener('click', () => {
  stopCam();
  document.getElementById('camStatus').textContent = '';
});

function stopCam() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  document.getElementById('camBtn').style.display = 'inline-block';
  document.getElementById('snapBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'none';
}

function camLoop() {
  if (!stream) return;
  sCtx.drawImage(video, 0, 0, W, H);
  applyEffect();
  animId = requestAnimationFrame(camLoop);
}

document.getElementById('saveBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'miroir_deformant.png';
  link.href = dstC.toDataURL('image/png');
  link.click();
});

function applyEffect() {
  const src = sCtx.getImageData(0, 0, W, H);
  const dst = dCtx.createImageData(W, H);
  const sd = src.data, dd = dst.data;
  const s = strength / 100;
  const cx = W / 2, cy = H / 2;
  const t = performance.now() / 1000;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      let sx = x, sy = y;
      const nx = (x - cx) / cx, ny = (y - cy) / cy;
      const r = Math.sqrt(nx * nx + ny * ny);

      if (currentFx === 'wave') {
        sx = x + Math.sin((y / H) * Math.PI * 6 + t * 2) * s * 50;
        sy = y + Math.sin((x / W) * Math.PI * 6 + t * 2) * s * 40;

      } else if (currentFx === 'lateral') {
        sx = x + Math.sin((y / H) * Math.PI * 2) * s * cx * 0.85;
        sy = y;

      } else if (currentFx === 'bulge') {
        const factor = r < 1 ? 1 / (1 - r * r * s * 0.9 + 0.01) : 1;
        sx = cx + nx * cx * factor * (1 - s * 0.5);
        sy = cy + ny * cy * factor * (1 - s * 0.5);

      } else if (currentFx === 'funnel') {
        // Entonnoir : rétrécissement horizontal qui augmente vers le bas
        const fy = y / H; // 0 en haut, 1 en bas
        const pinch = 1 - s * fy * 0.85;
        const scale = pinch > 0.05 ? pinch : 0.05;
        sx = cx + (x - cx) / scale;
        sy = y;

      } else if (currentFx === 'swirl') {
        const angle = r * s * Math.PI * 2;
        const cos = Math.cos(angle), sin = Math.sin(angle);
        sx = cx + (nx * cos - ny * sin) * cx;
        sy = cy + (nx * sin + ny * cos) * cy;

      } else if (currentFx === 'fisheye') {
        const theta = Math.atan2(ny, nx);
        const rn = r < 1 ? Math.pow(r, 1 + s * 1.5) : r;
        sx = cx + Math.cos(theta) * rn * cx;
        sy = cy + Math.sin(theta) * rn * cy;

      } else if (currentFx === 'fun') {
        sx = x + Math.sin(y * 0.08 + t) * s * 40;
        sy = y + Math.cos(x * 0.08 + t) * s * 40 * (y < H / 2 ? 1 : -1);
      }

      sx = Math.max(0, Math.min(W - 1, Math.round(sx)));
      sy = Math.max(0, Math.min(H - 1, Math.round(sy)));
      const si = (sy * W + sx) * 4, di = (y * W + x) * 4;
      dd[di] = sd[si]; dd[di+1] = sd[si+1]; dd[di+2] = sd[si+2]; dd[di+3] = sd[si+3];
    }
  }
  dCtx.putImageData(dst, 0, 0);
}

// démo par défaut
(function() {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const grd = ctx.createRadialGradient(W/2, H/2, 10, W/2, H/2, 200);
  grd.addColorStop(0, '#7F77DD');
  grd.addColorStop(0.5, '#1D9E75');
  grd.addColorStop(1, '#D85A30');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 80px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('😀', W/2 - 80, H/2);
  ctx.fillText('🎭', W/2 + 80, H/2 - 20);
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '18px sans-serif';
  ctx.fillText('Chargez votre image →', W/2, H - 28);
  sCtx.drawImage(c, 0, 0);
  srcImg = c;
  applyEffect();
  loopInterval = setInterval(applyEffect, 50);
})();
</script>
</body>
</html>
